name: Gerar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip CanalWebView-AndroidStudio.zip -d projeto
          find projeto -maxdepth 3 -type f | head -50

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        run: |
          chmod +x projeto/CanalWebView/gradlew

      - name: Compilar APK
        working-directory: projeto/CanalWebView
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CanalWebView-APK
          path: projeto/CanalWebView/app/build/outputs/apk/debug/app-debug.apk
